<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}SPAM SERVICE{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/bootstrap.min.css">
</head>
<body>

<div class="d-flex justify-content-center align-items-center min-vh-100">
    <div class="col-12 col-sm-8 col-md-6 col-lg-4">
        <h2 class="text-center mb-4">SPAM SERVICE</h2>

        {% load django_bootstrap5 %}

        <form method="post" class="mb-3">
            {% csrf_token %}
            {% bootstrap_form form %}

            <!-- Кнопка Входа -->
            <button type="submit" class="btn btn-outline-primary w-100">Войти</button>
        </form>

        <!-- Кнопка Регистрации — по центру под формой -->
        <div class="text-center">
            <a href="{% url 'users:register' %}" class="btn btn-outline-secondary w-50">
                Регистрация
            </a>
            <div class="text-center mt-1">
            <a href="{% url 'users:password_reset' %}" class="btn btn-outline-secondary w-50">Забыли пароль?</a>
            </div>
            </div>
    </div>
</div>

<script src="/static/js/bootstrap.bundle.min.js"></script>
</body>
</html>
