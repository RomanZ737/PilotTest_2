{% load static %}

<div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
    <div class="d-flex gap-2">
        <a class="btn {% if request.resolver_match.view_name == 'users:list' %}btn-light{% else %}btn-outline-light{% endif %}"
           href="{% url 'users:list' %}">
            <h5 class="mb-0"><i class="bi bi-people-fill"></i> Пилоты</h5>
        </a>
        <a class="btn {% if request.resolver_match.view_name == 'users:group_list' %}btn-light{% else %}btn-outline-light{% endif %}"
           href="{% url 'users:group_list' %}">
            <h5 class="mb-0"><i class="bi bi-collection"></i> Группы</h5>
        </a>
    </div>
    <div class="d-flex gap-2">
        <a href="#" class="btn btn-primary">
            <i class="bi bi-person-plus"></i> Добавить пилота
        </a>
        <a href="{% url 'users:group_create' %}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Добавить группу
        </a>
    </div>
</div>
