<div class="modal fade" id="passwordModal" tabindex="-1" aria-labelledby="passwordModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="passwordModalLabel">
                    <i class="bi bi-lock"></i> Сменить пароль
                </h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form id="passwordForm" method="post" action="{% url 'users:password_change' pilot.pk %}">
                {% csrf_token %}
                <div class="modal-body">
                    <p class="text-muted small">
                        Пилот: <strong>{{ pilot.last_name }} {{ pilot.first_name }}</strong>
                    </p>

                    <div class="mb-3">
                        <label for="newPassword" class="form-label">Новый пароль</label>
                        <input type="password" name="new_password" id="newPassword"
                               class="form-control" required minlength="8"
                               placeholder="Введите новый пароль...">
                    </div>

                    <div class="mb-3">
                        <label for="confirmPassword" class="form-label">Подтверждение пароля</label>
                        <input type="password" name="confirm_password" id="confirmPassword"
                               class="form-control" required minlength="8"
                               placeholder="Повторите пароль...">
                    </div>

                    <div id="passwordError" class="alert alert-danger d-none py-2 mb-0"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="submit" class="btn btn-warning">
                        <i class="bi bi-check-circle"></i> Сменить пароль
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    document.getElementById('passwordForm').addEventListener('submit', function(e) {
        const newPass = document.getElementById('newPassword').value;
        const confirmPass = document.getElementById('confirmPassword').value;
        const errorDiv = document.getElementById('passwordError');

        errorDiv.classList.add('d-none');

        if (newPass !== confirmPass) {
            e.preventDefault();
            errorDiv.textContent = 'Пароли не совпадают.';
            errorDiv.classList.remove('d-none');
            return;
        }

        if (newPass.length < 8) {
            e.preventDefault();
            errorDiv.textContent = 'Пароль должен содержать минимум 8 символов.';
            errorDiv.classList.remove('d-none');
            return;
        }
    });
</script>
