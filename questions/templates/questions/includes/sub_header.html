    {# Заголовок и кнопка создания #}
    <div class="d-flex flex-wrap justify-content-between align-items-center mb-4">
    <div class="d-flex gap-2">
        <a class="btn {% if request.resolver_match.view_name == 'questions:question_list' %}btn-light{% else %}btn-outline-light{% endif %}"
           href="{% url 'questions:question_list' %}">
            <h5 class="mb-0"><i class="bi bi-question-circle"></i> Вопросы</h5>
        </a>
        <a class="btn {% if request.resolver_match.view_name == 'questions:themes_list' %}btn-light{% else %}btn-outline-light{% endif %}"
           href="{% url 'questions:themes_list' %}">
            <h5 class="mb-0"><i class="bi bi-collection"></i> Темы</h5>
        </a>
    </div>
    <div class="d-flex gap-2">
        <a href="{% url 'questions:question_create' %}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Создать вопрос
        </a>
        <a href="{% url 'questions:theme_create' %}" class="btn btn-primary">
            <i class="bi bi-plus-circle"></i> Создать тему
        </a>
    </div>
</div>
