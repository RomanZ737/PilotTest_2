services:
  db:
    image: postgres:17
    restart: always
    env_file:
        - .env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    expose:
      - "5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER}" ]
      interval: 30s
      timeout: 10s
      retries: 5

  redis:
    image: redis:7-alpine   # или redis:latest
    restart: always
    volumes:
      - redis_data:/data    # сохранение данных (если нужно)
    # Порты наружу можно не открывать, если доступ нужен только изнутри docker-сети
    # expose:
    #   - "6379"
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: >
      bash -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy


volumes:
  postgres_data:
  static_volume:
  redis_data: