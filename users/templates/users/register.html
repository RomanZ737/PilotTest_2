<!-- login.html -->
{% extends "core/base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}

<div class="d-flex justify-content-center align-items-center ">
    <div class="col-12 col-sm-8 col-md-6 col-lg-5 ">

        <h2 class="text-center mb-4">
          {% if object %}
            Профиль
          {% else %}
            Регистрация
          {% endif %}
        </h2>
{% load django_bootstrap5 %}
  <form method="post">
    {% csrf_token %}
    {% bootstrap_form form %}
    {% if object %}
      <button type="submit" class="btn btn-outline-primary w-100">Сохранить</button>
    {% else %}
      <button type="submit" class="btn btn-outline-primary w-100">Зарегистрироваться</button>
    {% endif %}
    <a href="{% url 'core:home' %}" class="btn btn-outline-secondary mt-1 w-100">Вернуться</a>
  </form>
    </div>
</div>


{% endblock %}
