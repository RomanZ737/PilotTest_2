{% extends "core/base.html" %}

{% block title %}{{ page.title }}{% endblock %}

{% block content %}
<div class="container mt-4">
    {% include 'description/includes/sub_header.html' %}

    <div class="card border-top-0 rounded-top-0 border-primary border-3 shadow-sm">
        <div class="card-header bg-light d-flex justify-content-between align-items-center">
            <div class="d-flex align-items-center gap-2">
                <i class="bi bi-book text-primary fs-5"></i>
                <span class="fw-bold">{{ page.title }}</span>
            </div>
            {% if perms.description.change_descriptionpage %}
                <a href="{% url 'description:edit' page.slug %}" class="btn btn-sm btn-outline-primary" title="Редактировать">
                    <i class="bi bi-pencil"></i>
                </a>
            {% endif %}
        </div>
        <div class="card-body">
            {{ page.content|safe }}
        </div>
    </div>
</div>
{% endblock %}
