{% load user_tags %}

<div class="border-bottom box-shadow p-3 px-md-4 mb-3 " >

    <div class="d-flex flex-wrap align-items-center justify-content-between ">
        <h5 class="my-0 font-weight-normal">Pilot Test</h5>
        {% if user.is_authenticated %}
        <nav class="d-flex align-items-center gap-2">
            <div class="dropdown">
                <a class="btn btn-outline-light dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
                    {% if user.first_name or user.last_name %}
                        {{ user.first_name }} {{ user.last_name }}
                    {% else %}
                        {{ user.username }}
                    {% endif %}
                </a>
                <ul class="dropdown-menu dropdown-menu-end text-start">
                    <li><a class="dropdown-item" href="{% url 'users:user_update' %}">Профиль</a></li>
                    <li>
                        <form method="post" action="{% url 'users:logout' %}">
                            {% csrf_token %}
                            <button type="submit" class="dropdown-item text-start" style="border: none; background: none; width: 100%;">Выйти</button>
                        </form>
                    </li>
                </ul>
            </div>
        </nav>
    </div>

    <!-- Нижняя строка: кнопки навигации, выровненные влево -->
    <div class="d-flex flex-wrap align-items-center gap-2">
        <a class="btn {% if request.resolver_match.view_name == 'core:home' %}btn-light{% else %}btn-outline-light{% endif %}"
           href="{% url 'core:home' %}">Главная</a>

    </div>
    {% endif %}
</div>
